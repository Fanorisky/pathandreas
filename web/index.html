<!doctype html>
<meta charset="utf-8">
<title>PathAndreas viewer</title>
<link rel="stylesheet" href="style.css">
<div id="wrap">
  <canvas id="map"></canvas>
  <div id="hud">
    <div id="coords">--</div>
    <div id="hint">left-click: set FROM &middot; right-click: set TO &middot; drag: pan &middot; wheel: zoom</div>
  </div>
</div>
<aside id="panel">
  <h1>PathAndreas</h1>

  <section>
    <label>service
      <input id="url" value="ws://127.0.0.1:8090/">
    </label>
    <button id="connect">connect</button>
    <div id="status" class="off">disconnected</div>
  </section>

  <section>
    <label>query
      <select id="qtype">
        <option value="find_hybrid_path">find_hybrid_path (walk)</option>
        <option value="find_path">find_path (raw navmesh)</option>
        <option value="find_vehicle_path">find_vehicle_path</option>
        <option value="find_offroad_path">find_offroad_path</option>
        <option value="find_boat_path">find_boat_path</option>
      </select>
    </label>
    <label>offroad_cost <span id="costval">3.0</span>
      <input id="cost" type="range" min="1" max="8" step="0.5" value="3">
    </label>
    <div class="row">
      <button id="run">route</button>
      <button id="clear">clear</button>
      <button id="swap">swap</button>
    </div>
    <div class="pt">FROM <span id="fromtxt">--</span></div>
    <div class="pt">TO <span id="totxt">--</span></div>
  </section>

  <section>
    <label class="cb"><input type="checkbox" id="showveh" checked> vehicle nodes</label>
    <label class="cb"><input type="checkbox" id="showped" checked> pedestrian nodes</label>
    <label class="cb"><input type="checkbox" id="showcorr" checked> colour route by corridor</label>
  </section>

  <section id="stats"><div class="empty">no route yet</div></section>

  <section id="legend">
    <div><i class="sw on"></i> on the pedestrian corridor</div>
    <div><i class="sw off"></i> off the corridor</div>
    <div><i class="sw unv"></i> unverified hop (needs recovery)</div>
    <div><i class="sw climb"></i> climb / step link</div>
    <div><i class="sw vnode"></i> vehicle node &nbsp; <i class="sw pnode"></i> ped node</div>
  </section>

  <div id="log"></div>
</aside>
<script src="app.js"></script>
